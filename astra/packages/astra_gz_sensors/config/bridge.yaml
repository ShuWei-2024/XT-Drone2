# ros_gz_bridge mapping for the stable stage-2 ROS 2 sensor boundary.
- ros_topic_name: /sensors/lidar/points
  gz_topic_name: /sensors/lidar/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
  frame_id: mid360_link
- ros_topic_name: /sensors/camera/color/image_raw
  gz_topic_name: /sensors/camera/color/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  frame_id: camera_color_optical_frame
- ros_topic_name: /sensors/camera/depth/image_raw
  gz_topic_name: /sensors/camera/depth/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  frame_id: camera_depth_optical_frame
- ros_topic_name: /sensors/camera/color/camera_info
  gz_topic_name: /sensors/camera/color/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
  frame_id: camera_color_optical_frame
- ros_topic_name: /sensors/imu/data
  gz_topic_name: /sensors/imu/data
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
  frame_id: imu_link
