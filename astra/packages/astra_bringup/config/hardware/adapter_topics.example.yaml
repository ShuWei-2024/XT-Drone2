/**:
  ros__parameters:
    # Replace these with the actual driver topics after inspecting ros2 topic list.
    lidar_topic: /livox/lidar
    image_topic: /camera/color/image_raw
    camera_info_topic: /camera/color/camera_info
    imu_topic: /livox/imu

    output_lidar_topic: /fast_livo2/input/lidar
